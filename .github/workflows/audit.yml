# Checks every dependency in Cargo.lock against the RustSec advisory database:
# weekly (new advisories appear without any change here), and whenever a pull
# request changes the dependencies. Exceptions and their reasons are in deny.toml.
name: Security audit

on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths: [Cargo.toml, Cargo.lock, deny.toml]
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, deny.toml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
