# Builds the downloads for Windows, macOS and Linux when a version tag is pushed
# (for example `git tag v0.1.0 && git push origin v0.1.0`) and attaches them to a
# draft GitHub Release. Check the draft's notes on GitHub, then press Publish.
#
# Every file gets a build provenance attestation, so anyone can check a download
# was built here from this repository:
#   gh attestation verify <file> --repo nickmorell/bifrost
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.92.0"

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: macos-x86_64
            os: macos-15-intel
          # The oldest supported Ubuntu runner, so the program also starts on
          # distributions with an older glibc.
          - name: linux-x86_64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: bifrost-${{ github.ref_name }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libasound2-dev libdbus-1-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      # No build cache here on purpose: a release is built from scratch, so
      # nothing a pull request's run left behind can end up in a download.
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Build
        run: cargo build --release --locked --bin bifrost

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:ARCHIVE | Out-Null
          Copy-Item target/release/bifrost.exe, LICENSE, README.md $env:ARCHIVE
          Compress-Archive -Path $env:ARCHIVE -DestinationPath "$env:ARCHIVE.zip"

      # An app bundle, so macOS treats BiFrost as an app (Dock, notifications).
      # It is signed ad hoc only, not with an Apple Developer ID.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="$ARCHIVE/BiFrost.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/bifrost "$app/Contents/MacOS/bifrost"
          cp assets/brand/bifrost.icns "$app/Contents/Resources/bifrost.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>BiFrost</string>
            <key>CFBundleDisplayName</key><string>BiFrost</string>
            <key>CFBundleIdentifier</key><string>io.github.nickmorell.bifrost</string>
            <key>CFBundleIconFile</key><string>bifrost</string>
            <key>CFBundleExecutable</key><string>bifrost</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$app"
          cp LICENSE README.md "$ARCHIVE/"
          ditto -c -k --keepParent "$ARCHIVE" "$ARCHIVE.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir "$ARCHIVE"
          cp target/release/bifrost LICENSE README.md assets/linux/bifrost.desktop "$ARCHIVE/"
          cp assets/brand/png/bifrost-256.png "$ARCHIVE/bifrost.png"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.ARCHIVE }}.zip
            ${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error

  release:
    name: Draft the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the attestations: a short-lived signing identity, and storing them.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/bifrost-*

      # The GitHub CLI comes with the runner, so no third-party action gets
      # write access to the repository.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Quoted, so the shell leaves the backticks alone; @TAG@ is filled in below.
          cat > notes.md <<'NOTES'
          ## Downloads

          | System | File |
          |---|---|
          | Windows 10 and 11 (64-bit) | `bifrost-@TAG@-windows-x86_64.zip` |
          | macOS, Apple silicon (M1 and later) | `bifrost-@TAG@-macos-arm64.zip` |
          | macOS, Intel | `bifrost-@TAG@-macos-x86_64.zip` |
          | Linux (x86_64) | `bifrost-@TAG@-linux-x86_64.tar.gz` |

          BiFrost is not signed with a paid certificate yet, so your system will warn you the first time:

          - **Windows:** SmartScreen says it protected your PC. Choose *More info*, then *Run anyway*.
          - **macOS:** move BiFrost.app to Applications, then right-click it and choose *Open*. If macOS says
            it is damaged, run `xattr -dr com.apple.quarantine /Applications/BiFrost.app` once.
          - **Linux:** the program needs GTK 3, ALSA, D-Bus and libayatana-appindicator (installed on most
            desktops). Run `./bifrost` from the unpacked folder. To add it to your app menu, copy `bifrost`
            to `~/.local/bin`, `bifrost.desktop` to `~/.local/share/applications` and `bifrost.png` to
            `~/.local/share/icons/hicolor/256x256/apps`.

          `SHA256SUMS.txt` lists the checksum of every file. To check a download was built by this
          repository's release workflow, run `gh attestation verify <file> --repo nickmorell/bifrost`.
          NOTES
          sed -i "s/@TAG@/$GITHUB_REF_NAME/g" notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
